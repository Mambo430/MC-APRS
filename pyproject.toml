[build-system]
requires = ["hatchling >= 1.26.1"]
build-backend = "hatchling.build"

[project]
name = "mc-aprs"
dynamic = ["version"]
description = 'A MeshCore-APRS Gateway'
readme = "README.md"
requires-python = ">=3.10"
#license = "MIT"
license-files = { paths = ["LICENSE"] }
keywords = [
    "aprs",
    "aprs-gateway",
    "aprs-is",
    "gateway",
    "lora",
    "lora-gateway",
    "meshcore",
    "meshcore-gateway",
]
authors = [
  { name = "Adam Fourney", email = "adam.fourney@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Topic :: Communications :: Ham Radio",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "meshcore>=2.3.19",
  "aprslib",
  "PyYAML",
  "requests",
  "packaging",
]

[project.urls]
Documentation = "https://github.com/Mambo430/MC-APRS#readme"
Issues = "https://github.com/Mambo430/MC-APRS/issues"
Source = "https://github.com/Mambo430/MC-APRS"

[tool.hatch.version]
path = "src/mc_aprs/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --ignore-missing-imports --non-interactive {args:src/mc_aprs tests}"

[tool.coverage.run]
source_pkgs = ["mc_aprs", "tests"]
branch = true
parallel = true
omit = [
  "src/mc_aprs/__about__.py",
]

[tool.coverage.paths]
mc_aprs = ["src/mc_aprs", "*/mc_aprs/src/mc_aprs"]
tests = ["tests", "*/MC-APRS/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/mc_aprs"]
